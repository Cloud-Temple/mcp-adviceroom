# ============================================================
# Registre des modèles LLM — AdviceRoom v0.1.0
# ============================================================
# Rechargeable à chaud via l'admin API.
# Le modèle "default: true" est utilisé quand l'utilisateur
# choisit la catégorie sans spécifier de modèle.
#
# Catégories :
#   snc      — Modèles SecNumCloud (Cloud Temple LLMaaS)
#   openai   — Modèles OpenAI
#   anthropic — Modèles Anthropic
#   google   — Modèles Google Gemini
#
# Capabilities :
#   chat, tools, vision, streaming
#
# Autres champs optionnels :
#   supports_temperature — false pour les modèles qui rejettent le
#                           paramètre "temperature" (ex: claude-opus-5,
#                           gpt-5.6-terra). Défaut : true.
#   extra_params          — dict fusionné tel quel dans le payload envoyé
#                           au provider (ex: reasoning_effort). Défaut : {}.
# ============================================================

# Catégorie par défaut
default_category: snc

# --- Catégories ---
categories:
  snc:
    display_name: "SecNumCloud (LLMaaS)"
    description: "Modèles Cloud Temple qualifiés SecNumCloud"
    icon: "🛡️"
  openai:
    display_name: "OpenAI"
    description: "Modèles OpenAI (cloud public)"
    icon: "🟢"
  anthropic:
    display_name: "Anthropic"
    description: "Modèles Anthropic Claude (cloud public)"
    icon: "🟠"
  google:
    display_name: "Google"
    description: "Modèles Google Gemini (cloud public)"
    icon: "🔵"

# --- Modèles ---
models:
  # === SecNumCloud (LLMaaS) ===
  gpt-oss-120b:
    display_name: "GPT-OSS 120B"
    provider: llmaas
    category: snc
    api_model_id: "gpt-oss:120b"
    capabilities: [chat, tools, streaming]
    context_window: 131072
    default: true
    active: true

  qwen35-27b:
    display_name: "Qwen 3.5 27B"
    provider: llmaas
    category: snc
    api_model_id: "qwen3.5:27b"
    capabilities: [chat, tools, streaming]
    context_window: 1000000
    default: false
    active: true

  gemma4-31b:
    display_name: "Gemma 4 31B"
    provider: llmaas
    category: snc
    api_model_id: "gemma4:31b"
    capabilities: [chat, streaming]
    context_window: 250000
    default: false
    active: true

  # === OpenAI ===
  gpt-56-terra:
    display_name: "GPT-5.6 Terra"
    provider: openai
    category: openai
    api_model_id: "gpt-5.6-terra"
    capabilities: [chat, tools, streaming]
    context_window: 1000000  # hypothèse alignée sur gpt-54, à confirmer
    # ATTENTION — les deux réglages ci-dessous sont COUPLÉS. Mesuré le 06/09/2026
    # sur /v1/chat/completions (voir le détail dans les notes de la memory bank) :
    #
    #   reasoning_effort   temperature   tools   résultat
    #   (absent)           0.7           oui     400 function tools
    #   "high" / "low"     omise         oui     400 function tools
    #   "minimal"          omise         oui     400 valeur non supportée
    #   "none"             0.0 → 2.0     oui     200 OK
    #   (absent)           0.7           non     400 temperature
    #   "high"             omise         non     200 OK
    #
    # Autrement dit : c'est reasoning_effort="none" qui débloque À LA FOIS les
    # function tools ET le paramètre temperature. Retirer reasoning_effort
    # casserait donc aussi la temperature — ne pas toucher l'un sans l'autre.
    # Verrouillé par test_gpt_56_terra_carries_its_api_constraints.
    supports_temperature: true
    extra_params:
      # OBLIGATOIRE et doit valoir exactement "none". AdviceRoom passe TOUJOURS
      # les tools (cf. orchestrator._run_single_turn), donc toute valeur de
      # raisonnement active ("low", "medium", "high", "xhigh") casserait 100%
      # des appels à ce modèle. Contrepartie assumée : raisonnement désactivé.
      # Le tool calling reste fonctionnel malgré cela (round-trip 4 étapes
      # vérifié en réel le 06/09/2026).
      reasoning_effort: "none"
    default: true
    active: true

  gpt-54:
    display_name: "GPT-5.4"
    provider: openai
    category: openai
    api_model_id: "gpt-5.4"
    capabilities: [chat, tools, streaming]
    context_window: 1000000
    default: false
    active: true

  # === Anthropic ===
  claude-opus-5:
    display_name: "Claude Opus 5"
    provider: anthropic
    category: anthropic
    api_model_id: "claude-opus-5"
    capabilities: [chat, tools, streaming]
    context_window: 200000  # hypothèse alignée sur claude-opus-46, à confirmer
    supports_temperature: false  # le paramètre "temperature" est déprécié pour ce modèle (HTTP 400)
    default: true
    active: true

  claude-opus-46:
    display_name: "Claude Opus 4-6"
    provider: anthropic
    category: anthropic
    api_model_id: "claude-opus-4-6"
    capabilities: [chat, tools, streaming]
    context_window: 200000
    default: false
    active: true

  # === Google ===
  gemini-31-pro:
    display_name: "Gemini 3.1 Pro"
    provider: google
    category: google
    api_model_id: "gemini-3.1-pro-preview"
    capabilities: [chat, tools, streaming]
    context_window: 1048576
    default: true
    active: true
